<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LemmaLab">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<title>LemmaLab</title>
<meta name="theme-color" content="#3f2bc4">
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --ink:#1b2230; --muted:#667085; --line:#e3e6ec;
  --accent:#1f5fbf; --accent-soft:#e7effb;
  --again:#d64545; --hard:#d98a1c; --good:#2f9e5b; --easy:#2b7bd6;
  --p5:#c2410c; --p4:#d97706; --p3:#2563eb; --p2:#64748b; --p1:#a3a3a3;
  --def:#1f6feb; --satz:#7c3aed; --lem:#0f8b8d; --prop:#4f46e5; --kor:#16a34a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root:not(.light){--bg:#0f1115;--panel:#181b22;--ink:#e7e9ee;--muted:#98a2b3;--line:#2a2f3a;--accent:#6aa3ff;--accent-soft:#1c2a42;--shadow:none}
  :root:not(.light) .scan{filter:invert(.92) hue-rotate(180deg)}
}
:root.dark{--bg:#0f1115;--panel:#181b22;--ink:#e7e9ee;--muted:#98a2b3;--line:#2a2f3a;--accent:#6aa3ff;--accent-soft:#1c2a42;--shadow:none}
:root.dark .scan{filter:invert(.92) hue-rotate(180deg)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;font-size:16px}  /* ≥16px: iOS zoomt sonst beim Antippen hinein */
html,body{overflow-x:hidden}
.grid>*{min-width:0}
.li .t b,.fc .ttl{overflow-wrap:anywhere}
a{color:var(--accent)}
.app{max-width:900px;margin:0 auto;padding:calc(10px + var(--safe-t)) 14px calc(84px + var(--safe-b))}
header.top{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:12.5px}
header.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.gray{background:var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
nav.tabs .in{display:flex;max-width:900px;width:100%}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:339px){.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){
  .app{padding-left:12px;padding-right:12px}
  .card{padding:14px}
  header.top h1{font-size:16px}
  header.top .sub{font-size:12px}
  .kpi .v{font-size:23px}
  .kpi .l{font-size:12px}
  nav.tabs button{font-size:10.5px;min-width:0}
  .filters select{flex:1 1 45%}
}
.kpi .v{font-size:26px;font-weight:750;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
h2{font-size:16px;margin:18px 2px 8px}
h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* Lernkarte */
.study-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:80px}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.fc{padding:20px 18px;min-height:260px;display:flex;flex-direction:column}
.fc .kind{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fc .ttl{font-size:23px;font-weight:750;letter-spacing:-.015em;margin:6px 0 4px;line-height:1.2}
.fc .meta{color:var(--muted);font-size:12.5px}
.fc .prompt{margin-top:18px;padding:12px 14px;border-radius:11px;background:var(--accent-soft);font-size:14px}
.scanwrap{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.scan{display:block;width:100%;height:auto}
.mask{position:absolute;background:#d9dde5;border-radius:4px}
:root.dark .mask{background:#d9dde5}
.tip{margin-top:12px;border-left:4px solid var(--hard);background:color-mix(in srgb,var(--hard) 10%,transparent);padding:9px 12px;border-radius:8px;font-size:14px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:12px;padding:11px 4px 9px;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.rate button small{font-weight:500;opacity:.9;font-size:11.5px;margin-top:3px}
.rate .r1{background:var(--again)} .rate .r2{background:var(--hard)} .rate .r3{background:var(--good)} .rate .r4{background:var(--easy)}
.rate.three{grid-template-columns:repeat(3,1fr)}
textarea.note{width:100%;min-height:90px;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.kbd{font-size:11px;color:var(--muted)}
/* Listen */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:650}
.li .t .m{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar>span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
/* Quiz */
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;font-weight:600}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.opt.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 14%,var(--panel))}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--panel);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:13.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.95}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.center{text-align:center}
.empty{padding:34px 10px;text-align:center}
.empty .big{font-size:40px}
svg.chart text{fill:var(--muted);font-size:11px}
svg.chart{display:block;max-height:210px;margin:0 auto}
.scanwrap{cursor:zoom-in}
.zoombox{overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
.zoombox img{max-width:none}
.zoomchip{position:absolute;right:6px;bottom:6px;font-size:11.5px;font-weight:600;background:rgba(27,34,48,.72);color:#fff;border-radius:7px;padding:3px 7px;pointer-events:none}
.actionbar{margin-top:16px}
.modal.full .sheet{max-width:none;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column;padding-top:calc(14px + var(--safe-t))}
.modal.full .zoombox{flex:1}
@media (hover:hover) and (pointer:fine){.zoomchip{display:none}}
@media (hover:none){.hide-touch{display:none}}
/* ---------- Handy: Fokusmodus beim Lernen ---------- */
@media (max-width:767px), (max-height:559px){
  body.focus nav.tabs, body.focus header.top{display:none}
  body.focus .app{padding-top:calc(8px + var(--safe-t));padding-bottom:calc(150px + var(--safe-b))}
  body.focus .fc{padding:16px 14px;min-height:0}
  body.focus .fc .ttl{font-size:21px}
  body.focus .fc .scanwrap{margin-left:-14px;margin-right:-14px;border-radius:0;border-left:0;border-right:0}
  body.focus .actionbar{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px calc(10px + var(--safe-b));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30}
  body.focus .actionbar .rate{margin-top:0}
  body.focus .ratehelp{display:none}
  body.focus .tip{font-size:13.5px;padding:8px 10px}
  body.focus .study-head{margin-bottom:8px}
}
.sync{font-size:11.5px}
.hist{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.hist .dots{display:inline-flex;gap:3px}
.hist .dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hide{display:none!important}

/* ---------- Tablet / Desktop ---------- */
.home .col>h2:first-child{margin-top:18px}
@media (min-width:768px) and (min-height:560px){
  html,body{font-size:16px}
  nav.tabs{top:0;bottom:0;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding:calc(20px + var(--safe-t)) 12px calc(16px + var(--safe-b))}
  nav.tabs::before{content:"LemmaLab";font-weight:750;font-size:18px;padding:4px 12px 18px;letter-spacing:-.01em}
  nav.tabs .in{flex-direction:column;gap:4px}
  nav.tabs button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px;justify-content:flex-start}
  nav.tabs button.on{background:var(--accent-soft)}
  nav.tabs button svg{width:20px;height:20px}
  .app{max-width:none;margin-left:210px;padding:calc(22px + var(--safe-t)) 32px 40px}
  .app>*{max-width:1180px;margin-left:auto;margin-right:auto}
  header.top h1{font-size:22px}
  header.top .sub{font-size:13.5px}
  .card{padding:20px}
  .kpi .v{font-size:32px}
  .kpi .l{font-size:13.5px}
  .small{font-size:14px}
  .muted.small,.kbd{font-size:13px}
  h2{font-size:18px;margin-top:24px}
  h3{font-size:16px}
  .fc{max-width:900px;margin:0 auto;padding:28px 32px;min-height:360px}
  .fc .ttl{font-size:30px}
  .fc .meta{font-size:14px}
  .fc .prompt{font-size:16px}
  .study-head{max-width:900px;margin-left:auto;margin-right:auto}
  .rate button{padding:15px 4px 13px;font-size:17px}
  .opt{font-size:16px;padding:14px 16px}
  .tip{font-size:15px}
  .toast{bottom:28px}
  .modal .sheet{max-width:900px}
  table.t{font-size:14.5px}
  .li{padding:12px 6px}
}
@media (min-width:1000px){
  .home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .home .col>h2:first-child{margin-top:0}
  .home .hero .kpi .v{font-size:44px}
  .grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols2>.card:last-child:nth-child(odd){grid-column:1/-1}
  #view>.card+.card{margin-top:16px}
}
@media (min-width:1000px){ .quizgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start} .quizgrid>.card{margin-top:0!important} }

/* ---------- Notch / Dynamic Island (iPhone quer) ---------- */
.app{padding-left:calc(14px + var(--safe-l));padding-right:calc(14px + var(--safe-r))}
nav.tabs{padding-left:var(--safe-l);padding-right:var(--safe-r)}
.modal .sheet{padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r))}
body.focus .actionbar{padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r))}
@media (max-width:480px){.app{padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r))}}
/* iPhone quer: wenig Höhe → alles kompakter */
@media (orientation:landscape) and (max-height:559px){
  .app{padding-top:calc(8px + var(--safe-t));padding-left:max(48px, calc(14px + var(--safe-l)));padding-right:max(48px, calc(14px + var(--safe-r)))}
  body.focus .actionbar{padding-left:max(48px, calc(12px + var(--safe-l)));padding-right:max(48px, calc(12px + var(--safe-r)))}
  nav.tabs{padding-left:max(40px, var(--safe-l));padding-right:max(40px, var(--safe-r))}
  .modal .sheet{padding-left:max(48px, calc(16px + var(--safe-l)));padding-right:max(48px, calc(16px + var(--safe-r)))}
  body.focus .app{padding-top:8px;padding-bottom:calc(78px + var(--safe-b))}
  body.focus .study-head{margin-bottom:6px}
  body.focus .study-head .btn{padding:6px 11px}
  body.focus .fc{padding:12px 16px}
  body.focus .fc .ttl{font-size:20px;margin:2px 0}
  body.focus .fc .prompt{margin-top:10px;padding:9px 12px;font-size:14px}
  body.focus .fc .scanwrap{margin-left:-16px;margin-right:-16px}
  body.focus .actionbar{padding-top:7px;padding-bottom:calc(7px + var(--safe-b))}
  body.focus .actionbar .btn.big{padding:10px;font-size:15px}
  body.focus .rate{gap:10px}
  body.focus .rate button{padding:7px 4px 6px;flex-direction:row;justify-content:center;gap:6px;font-size:15px}
  body.focus .rate button small{margin-top:0}
  body.focus .tip{margin-top:8px}
  body.focus .hist{margin-top:6px}
  nav.tabs button{flex-direction:row;gap:6px;padding:6px 2px 7px;font-size:12px}
  nav.tabs button svg{width:19px;height:19px}
  .app{padding-bottom:calc(60px + var(--safe-b))}
  .modal .sheet{max-height:100vh}
}

/* Prädikatenlogik */
details.logic{margin-top:12px;border:1px solid var(--line);border-left:4px solid var(--prop);border-radius:10px;background:color-mix(in srgb,var(--prop) 5%,var(--panel));padding:8px 12px}
details.logic summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--prop);list-style:none}
details.logic summary::-webkit-details-marker{display:none}
details.logic summary::before{content:"▸ ";}
details.logic[open] summary::before{content:"▾ ";}
.lrow{margin-top:6px}
.llab{font-size:12px;font-weight:600;color:var(--muted)}
.lf{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:3px 0 4px;line-height:2.1}
.lf .katex{font-size:1.08em;white-space:normal}
@media (max-width:480px){.lf .katex{font-size:.95em}}

/* Tages-To-do */
ul.todo{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.todo li{display:flex;gap:12px;align-items:center}
ul.todo .cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .3s}
ul.todo li.done .cb{background:var(--good);border-color:var(--good);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
ul.todo .cb svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s .15s ease forwards}
ul.todo .ti{flex:1;min-width:0}
ul.todo .tl{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14.5px}
ul.todo .tl .muted{font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
ul.todo li.done .tl>span:first-child{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--muted)}
ul.todo .tb{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
ul.todo .tb i{display:block;height:100%;border-radius:9px;transition:width .6s ease}
/* Erledigt-Ansicht */
.donehero{text-align:center;padding:10px 0 4px}
.bigcheck{width:96px;height:96px;display:block;margin:4px auto 6px}
.bigcheck .c{fill:color-mix(in srgb,var(--good) 14%,transparent);stroke:var(--good);stroke-width:6;stroke-dasharray:330;stroke-dashoffset:330;animation:draw .7s ease forwards;transform-origin:center}
.bigcheck .k{fill:none;stroke:var(--good);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s .55s ease forwards}
.bigcheck{animation:pop .6s .45s cubic-bezier(.2,1.6,.4,1) both}
.donehero .dt{font-size:22px;font-weight:800;letter-spacing:-.01em;animation:rise .5s .7s ease both}
.donehero .ds{color:var(--muted);font-size:13.5px;margin-top:4px;animation:rise .5s .85s ease both}
.donehero .dn{margin-top:10px;font-size:14px;animation:rise .5s 1s ease both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:100}
@media (prefers-reduced-motion:reduce){.bigcheck,.bigcheck *,.donehero *,ul.todo *{animation:none!important;stroke-dashoffset:0!important}}

/* Login */
#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));overflow:auto;animation:rise .35s ease}
#login .lbox{width:100%;max-width:380px;text-align:center}
