<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analysis I – Definitionen & Sätze lernen</title>
<meta name="theme-color" content="#1f3a5f">
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --ink:#1b2230; --muted:#667085; --line:#e3e6ec;
  --accent:#1f5fbf; --accent-soft:#e7effb;
  --again:#d64545; --hard:#d98a1c; --good:#2f9e5b; --easy:#2b7bd6;
  --p5:#c2410c; --p4:#d97706; --p3:#2563eb; --p2:#64748b; --p1:#a3a3a3;
  --def:#1f6feb; --satz:#7c3aed; --lem:#0f8b8d; --prop:#4f46e5; --kor:#16a34a;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not(.light){--bg:#0f1115;--panel:#181b22;--ink:#e7e9ee;--muted:#98a2b3;--line:#2a2f3a;--accent:#6aa3ff;--accent-soft:#1c2a42;--shadow:none}
  :root:not(.light) .scan{filter:invert(.92) hue-rotate(180deg)}
}
:root.dark{--bg:#0f1115;--panel:#181b22;--ink:#e7e9ee;--muted:#98a2b3;--line:#2a2f3a;--accent:#6aa3ff;--accent-soft:#1c2a42;--shadow:none}
:root.dark .scan{filter:invert(.92) hue-rotate(180deg)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:900px;margin:0 auto;padding:calc(10px + var(--safe-t)) 14px calc(84px + var(--safe-b))}
header.top{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:12.5px}
header.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.gray{background:var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
nav.tabs .in{display:flex;max-width:900px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.kpi .v{font-size:26px;font-weight:750;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
h2{font-size:16px;margin:18px 2px 8px}
h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* Lernkarte */
.study-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:80px}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.fc{padding:20px 18px;min-height:260px;display:flex;flex-direction:column}
.fc .kind{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fc .ttl{font-size:23px;font-weight:750;letter-spacing:-.015em;margin:6px 0 4px;line-height:1.2}
.fc .meta{color:var(--muted);font-size:12.5px}
.fc .prompt{margin-top:18px;padding:12px 14px;border-radius:11px;background:var(--accent-soft);font-size:14px}
.scanwrap{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.scan{display:block;width:100%;height:auto}
.mask{position:absolute;background:#d9dde5;border-radius:4px}
:root.dark .mask{background:#d9dde5}
.tip{margin-top:12px;border-left:4px solid var(--hard);background:color-mix(in srgb,var(--hard) 10%,transparent);padding:9px 12px;border-radius:8px;font-size:14px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:12px;padding:11px 4px 9px;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.rate button small{font-weight:500;opacity:.9;font-size:11.5px;margin-top:3px}
.rate .r1{background:var(--again)} .rate .r2{background:var(--hard)} .rate .r3{background:var(--good)} .rate .r4{background:var(--easy)}
.rate.three{grid-template-columns:repeat(3,1fr)}
textarea.note{width:100%;min-height:90px;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.kbd{font-size:11px;color:var(--muted)}
/* Listen */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:650}
.li .t .m{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;color:#fff;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar>span{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
/* Quiz */
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;font-weight:600}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.opt.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 14%,var(--panel))}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--panel);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:13.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);background:#1b2230;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.95}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.center{text-align:center}
.empty{padding:34px 10px;text-align:center}
.empty .big{font-size:40px}
svg.chart text{fill:var(--muted);font-size:11px}
.scanwrap{cursor:zoom-in}
.zoombox{overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
.zoombox img{width:max(100%,780px);max-width:none}
.sync{font-size:11.5px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Analysis I · Definitionen & Sätze</h1>
      <div class="sub" id="hdrSub">Kapitel 1–9 · Spaced Repetition</div>
    </div>
    <div class="grow"></div>
    <span class="pill gray sync" id="syncPill" title="Speicherort des Fortschritts">lokal</span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
