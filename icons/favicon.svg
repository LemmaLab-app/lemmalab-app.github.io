<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6fd6"/>
      <stop offset="1" stop-color="#14305c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06142b" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- hintere Karte -->
  <g transform="rotate(-11 512 540)" filter="url(#sh)">
    <rect x="262" y="250" width="500" height="580" rx="54" fill="#9fc0f0" opacity="0.55"/>
  </g>
  <!-- vordere Karte -->
  <g transform="rotate(6 512 540)" filter="url(#sh)">
    <rect x="262" y="236" width="500" height="600" rx="54" fill="url(#card)"/>
    <!-- Integralzeichen -->
    <path d="M 610 330 C 585 300, 540 310, 528 360 C 512 430, 520 540, 506 640 C 496 715, 470 752, 432 742 C 410 736, 404 714, 414 700"
          fill="none" stroke="#1f5fbf" stroke-width="44" stroke-linecap="round"/>
    <circle cx="612" cy="332" r="30" fill="#1f5fbf"/>
    <circle cx="412" cy="702" r="30" fill="#1f5fbf"/>
    <!-- Wiederholungs-Haken -->
    <circle cx="650" cy="720" r="62" fill="#2f9e5b"/>
    <path d="M 620 722 L 643 746 L 684 698" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
